# =====================================================================
# flower-microservices-scaffolding CI/CD（GitHub Actions）
# @Author: 花海
# @Date: 2026/08/16
# @Description: 推送 main / 版本 tag / PR 时执行：
#               test       静态类型检查（pyright）+ 单元测试（pytest 硬性门禁）
#               build-image 三服务矩阵：构建业务镜像 → Trivy 扫描 → /health/live 冒烟 → 推送 GHCR
#               镜像地址：ghcr.io/<org>/<repo>-<service>（如 flower-microservices-scaffolding-py-gateway）
#               镜像推送：push main 推测试标签 <分支名>-<时间戳>-<构建号> + latest；版本 tag v* 推 SemVer + latest；
#               PR 只构建/扫描/冒烟、不推送（详见 docs/CI-CD.md）。
# 前置条件（跨仓库访问，详见 docs/CI-CD.md §1.2）：
#   1) 框架仓库 flower-star-dream/flower-web-infrastructure 需可被本工作流检出（公开，或配置
#      PAT 存为 Secrets 并将下方 checkout 的 token 指向它）；框架依赖经检出后以 editable 方式安装。
#   2) 业务镜像 Dockerfile 通过 git+https 安装框架（min-microservice extras），需可访问框架仓库。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # 版本 tag 无条件触发：发布正式版镜像，不受 paths-ignore 影响
    paths-ignore:         # 仅文档/非代码变更不触发（不参与单元测试与镜像构建）
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"

jobs:
  test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出脚手架
        uses: actions/checkout@v4

      - name: 检出框架仓库（本地 editable 依赖方式，锁定框架正式版本 v1.0.0）
        uses: actions/checkout@v4
        with:
          repository: flower-star-dream/flower-web-infrastructure
          path: flower-web-infrastructure
          ref: v1.0.0
          # 框架仓库为私有时需配置 PAT（Secrets.FRAMEWORK_PAT，contents:read）并取消下方注释；
          # 仓库公开时无需 token
          # token: ${{ secrets.FRAMEWORK_PAT }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装框架依赖（editable，测试用内存注册中心/MQ，不依赖 Nacos/RocketMQ/MinIO）
        run: pip install -e ./flower-web-infrastructure[mysql,redis,migrate]

      - name: 安装脚手架依赖（dev）
        run: pip install -e ".[dev]"

      - name: 静态类型检查（pyright，覆盖三服务源码）
        run: pyright

      - name: 单元测试（pytest，覆盖三服务 + CLI 脚本测试）
        run: pytest -q

  build-image:
    name: 构建 Docker 业务镜像（${{ matrix.service }}）
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user-service, order-service]
    # GHCR 推送所需权限（GITHUB_TOKEN 写包权限）
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出脚手架
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建业务镜像
        # 各服务镜像自包含多阶段构建（build 阶段 git+ 安装框架 min-microservice extras，
        # runtime 仅拷贝 site-packages + 业务代码），不依赖框架基础镜像
        run: |
          docker build -t flower-microservices-${{ matrix.service }}:ci \
            -f services/${{ matrix.service }}/Dockerfile services/${{ matrix.service }}

      - name: 镜像漏洞扫描（Trivy，高危/严重阻断上线）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flower-microservices-${{ matrix.service }}:ci
          format: table
          exit-code: "1"          # 存在高危/严重漏洞即失败（阻断）
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 忽略无修复版本的漏洞，避免无解阻断

      - name: 镜像冒烟验证（/health/live 存活可达）
        # 存活探针 /health/live 仅校验进程存活、不探测依赖（整改 S19-1）；
        # 服务启动注册到 Nacos 失败时优雅降级（日志告警），不影响存活
        env:
          SMOKE_PORT: ${{ matrix.service == 'gateway' && '8000' || matrix.service == 'user-service' && '8001' || '8002' }}
        run: |
          docker run -d --name scaffold-smoke -p 18000:$SMOKE_PORT flower-microservices-${{ matrix.service }}:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/health/live > /dev/null 2>&1; then
              echo "health check passed"; exit 0
            fi
            sleep 1
          done
          docker logs scaffold-smoke || true
          echo "health check failed" >&2
          exit 1

      - name: 推送镜像（main 分支：测试标签 + latest）
        # 整改 S20-3 标签规范：测试版 <分支名>-<时间戳>-<构建号>（如 main-20260816103000-42）；
        # latest 跟随最新 main 构建；镜像地址按服务维度 ghcr.io/<org>/<repo>-<service>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-${{ matrix.service }}
          docker tag flower-microservices-${{ matrix.service }}:ci $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker push $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker tag flower-microservices-${{ matrix.service }}:ci $IMAGE:latest
          docker push $IMAGE:latest

      - name: 推送镜像（版本 tag v*：SemVer + latest）
        # 正式版：语义化版本（与 pyproject.toml 版本号保持一致），同时更新 latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-${{ matrix.service }}
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag flower-microservices-${{ matrix.service }}:ci $IMAGE:$VERSION
          docker push $IMAGE:$VERSION
          docker tag flower-microservices-${{ matrix.service }}:ci $IMAGE:latest
          docker push $IMAGE:latest
