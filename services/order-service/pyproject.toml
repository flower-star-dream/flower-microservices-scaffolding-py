[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-service"
version = "0.1.0"
description = "flower 微服务脚手架示例服务：订单管理（独立库 flower_order，Feign 调用 user-service）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "花海" }]
license = { text = "MIT" }
keywords = ["web", "backend", "fastapi", "microservice", "order"]

# 框架依赖（flower-web-infrastructure）由仓库根统一安装（见根 pyproject.toml 注释），本服务不再重复声明
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyright>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
