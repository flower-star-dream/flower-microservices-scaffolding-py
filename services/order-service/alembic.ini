# Alembic database migration configuration (compliance S13-1, authoritative change management tool).
# NOTE: This file is parsed by configparser with the locale encoding on Windows (GBK),
# so keep all comments ASCII-only. Author/date/description metadata lives in alembic/env.py.
# Run from repo root: alembic -c services/order-service/alembic.ini upgrade head
[alembic]
# Directory of migration scripts (relative to this ini file).
script_location = alembic
# Add this service dir to sys.path (env.py also appends src/ so order_service is importable).
prepend_sys_path = .
# Database URL: left empty; injected by alembic/env.py (env var ORDER_DATABASE_URL wins over this key).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
